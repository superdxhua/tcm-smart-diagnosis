<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.coze.cn https://*.coze.cn data: blob:">
  <title>智能中医辅助诊疗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
        'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 60px;
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #C8102E 0%, #8B0000 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(200, 16, 46, 0.3);
    }

    .logo svg {
      width: 80px;
      height: 80px;
      fill: white;
    }

    h1 {
      color: #333;
      font-size: 36px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .feature {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      transition: all 0.3s ease;
    }

    .feature:hover {
      background: #e9ecef;
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .feature-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .feature-title {
      color: #333;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .feature-desc {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #C8102E 0%, #8B0000 100%);
      color: white;
      padding: 16px 48px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(200, 16, 46, 0.3);
      cursor: pointer;
      border: none;
      margin: 10px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(200, 16, 46, 0.4);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: #C8102E;
      border: 2px solid #C8102E;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #C8102E;
      color: white;
    }

    .info {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e0e0e0;
      color: #999;
      font-size: 14px;
    }

    .info p {
      margin-bottom: 10px;
    }

    .loading {
      display: none;
      margin-top: 20px;
    }

    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #C8102E;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    </div>

    <h1>智能中医辅助诊疗</h1>
    <p class="subtitle">基于 AI 的中医智能诊断与处方生成系统<br>传承千年智慧，赋能现代医疗</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div class="feature-title">AI 智能分析</div>
        <div class="feature-desc">基于千问大模型，智能分析症状，提供诊断建议</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📚</div>
        <div class="feature-title">经方医案</div>
        <div class="feature-desc">收录张仲景经方与历代名医医案，权威可靠</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔍</div>
        <div class="feature-title">图片识别</div>
        <div class="feature-desc">支持舌象、面相图片智能识别，辅助诊断</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💊</div>
        <div class="feature-title">处方生成</div>
        <div class="feature-desc">根据症状自动生成中药处方，剂量精准</div>
      </div>
    </div>

    <div>
      <button class="btn" onclick="startApp()">启动应用</button>
      <button class="btn btn-secondary" onclick="openWebVersion()">网页版</button>
    </div>

    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>正在启动应用...</p>
    </div>

    <div class="status" id="status"></div>

    <div class="info">
      <p><strong>版本：</strong>1.0.0</p>
      <p><strong>平台：</strong>桌面版</p>
      <p><strong>免责声明：</strong>本系统仅提供辅助诊疗建议，不代替专业医生诊断。请在专业医师指导下使用。</p>
      <p>© 2024 智能中医辅助诊疗系统</p>
    </div>
  </div>

  <script>
    // 检测运行环境
    console.log('运行环境:', window.location.protocol)
    console.log('是否 Electron:', typeof window.electronAPI !== 'undefined')
    console.log('平台信息:', window.platform)

    function startApp() {
      const loading = document.getElementById('loading')
      const status = document.getElementById('status')

      loading.style.display = 'block'

      // 模拟启动过程
      setTimeout(() => {
        loading.style.display = 'none'
        status.style.display = 'block'
        status.className = 'status success'
        status.textContent = '✓ 应用启动成功！正在加载模块...'

        setTimeout(() => {
          // 这里可以跳转到实际的应用页面
          alert('应用正在开发中，即将上线完整功能！\n\n当前版本为演示版本。')
        }, 1500)
      }, 2000)
    }

    function openWebVersion() {
      // 打开网页版
      const url = 'http://localhost:5000'
      if (typeof window.electronAPI !== 'undefined') {
        // Electron 环境
        window.open(url, '_blank')
      } else {
        // 浏览器环境
        window.location.href = url
      }
    }

    // 页面加载完成后
    window.addEventListener('DOMContentLoaded', () => {
      console.log('页面加载完成')
    })
  </script>
</body>
</html>
