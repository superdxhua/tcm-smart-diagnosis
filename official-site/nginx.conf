# Nginx配置文件 - 天源堂海王星药店官网
# 文件位置：/etc/nginx/sites-available/zhongyihskhealth.com
# 或：/etc/nginx/conf.d/zhongyihskhealth.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name zhongyihskhealth.com;

    # 网站根目录
    root /var/www/zhongyihskhealth.com;
    index index.html;

    # 访问日志和错误日志
    access_log /var/log/nginx/zhongyihskhealth.com.access.log;
    error_log /var/log/nginx/zhongyihskhealth.com.error.log;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 主页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

