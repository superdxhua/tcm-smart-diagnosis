<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta content="width=device-width,initial-scale=1,user-scalable=no" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>中医智能好帮手</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="基于AI大模型的中医智能健康平台，提供智能健康咨询、经方推荐、健康方案生成、健康记录管理等专业服务。传承千年中医智慧，融合现代AI技术。">
  <meta name="keywords" content="中医, 智能健康, AI咨询, 中医健康, 经方, 张仲景, 医案, 健康管理">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-title" content="中医智能">

  <!-- Android Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1890ff">
  <meta name="application-name" content="中医智能">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="中医智能好帮手">
  <meta property="og:description" content="AI驱动的中医智能健康平台">
  <meta property="og:image" content="/icons/icon-512x512.png">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="中医智能好帮手">
  <meta name="twitter:description" content="AI驱动的中医智能健康平台">
  <meta name="twitter:image" content="/icons/icon-512x512.png">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <script><%= htmlWebpackPlugin.options.script %></script>

  <script>
    // PWA install prompt handler
    window.addEventListener('beforeinstallprompt', function(e) {
      // Prevent Chrome 67 and earlier from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later
      window.deferredPrompt = e;
      // Update UI to notify the user they can add to home screen
      console.log('beforeinstallprompt event fired');
    });

    // Handle app installed
    window.addEventListener('appinstalled', function(e) {
      console.log('app installed');
      window.deferredPrompt = null;
    });
  </script>
</head>

<body>
  <div id="app">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="lab(2.86037 0.455312 0.568903)"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="
        position: fixed;
        inset: 0;
        margin: auto;
        width: 24px;
        height: 24px;
        animation: __app-loading-spin 1s linear infinite;
      ">
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
    <style>
      @keyframes __app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
</body>

</html>
