<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白色背景圆形 -->
  <circle cx="256" cy="256" r="250" fill="#FFFFFF" stroke="#C8102E" stroke-width="10"/>

  <!-- 葫芦图案 -->
  <g transform="translate(256, 260) scale(0.85)">
    <!-- 葫芦上部（小圆） -->
    <ellipse cx="0" cy="-70" rx="70" ry="80" fill="#C8102E"/>

    <!-- 葫芦下部（大圆） -->
    <ellipse cx="0" cy="70" rx="90" ry="100" fill="#C8102E"/>

    <!-- 葫芦颈部 -->
    <rect x="-25" y="-40" width="50" height="80" fill="#C8102E"/>

    <!-- 葫芦盖 -->
    <ellipse cx="0" cy="-150" rx="30" ry="15" fill="#8B0000"/>

    <!-- 葫芦高光（增加立体感） -->
    <ellipse cx="-30" cy="-100" rx="20" ry="40" fill="rgba(255,255,255,0.3)"/>
    <ellipse cx="-35" cy="80" rx="25" ry="50" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- 金色光环 -->
  <g transform="translate(256, 260)">
    <!-- 外圈光环 -->
    <circle cx="0" cy="0" r="210" stroke="url(#goldGradient)" stroke-width="6" fill="none" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- 光芒 -->
    <g stroke="#FFD700" stroke-width="4" fill="none" opacity="0.6">
      <line x1="0" y1="-220" x2="0" y2="-190"/>
      <line x1="0" y1="220" x2="0" y2="190"/>
      <line x1="-220" y1="0" x2="-190" y2="0"/>
      <line x1="220" y1="0" x2="190" y2="0"/>
      <line x1="-155" y1="-155" x2="-134" y2="-134"/>
      <line x1="155" y1="155" x2="134" y2="134"/>
      <line x1="155" y1="-155" x2="134" y2="-134"/>
      <line x1="-155" y1="155" x2="-134" y2="134"/>
    </g>
  </g>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>