<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白色背景圆形 -->
  <circle cx="256" cy="256" r="250" fill="#FFFFFF" stroke="#C8102E" stroke-width="10"/>

  <!-- 太极图案 -->
  <g transform="translate(256, 256) scale(0.85)">
    <!-- 阴（黑色部分） -->
    <path d="M0,200 A200,200 0 0,1 0,-200 A100,100 0 0,1 0,0 A100,100 0 0,0 0,200 Z" fill="#C8102E"/>

    <!-- 阳（白色部分） -->
    <circle cx="0" cy="-100" r="30" fill="#FFFFFF"/>
    <circle cx="0" cy="100" r="30" fill="#C8102E"/>
  </g>

  <!-- 科技线条装饰 -->
  <g stroke="#1890FF" stroke-width="3" fill="none" opacity="0.6">
    <circle cx="256" cy="256" r="230" stroke-dasharray="10,10"/>
    <circle cx="256" cy="256" r="210" stroke-dasharray="5,15"/>
  </g>
</svg>