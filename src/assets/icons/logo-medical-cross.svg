<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白色背景圆形 -->
  <circle cx="256" cy="256" r="250" fill="#FFFFFF" stroke="#C8102E" stroke-width="10"/>

  <!-- 医疗十字 -->
  <g transform="translate(256, 260)">
    <!-- 十字主体 -->
    <rect x="-40" y="-120" width="80" height="240" rx="10" fill="#C8102E"/>
    <rect x="-120" y="-40" width="240" height="80" rx="10" fill="#C8102E"/>

    <!-- 十字高光（增加立体感） -->
    <rect x="-30" y="-110" width="20" height="220" rx="8" fill="rgba(255,255,255,0.3)"/>
    <rect x="-110" y="-30" width="220" height="20" rx="8" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- 科技线条装饰 -->
  <g stroke="#1890FF" stroke-width="2" fill="none" opacity="0.5">
    <!-- 外圈科技圆环 -->
    <circle cx="256" cy="260" r="200" stroke-dasharray="15,10"/>

    <!-- 四角的科技元素 -->
    <g stroke-width="3">
      <!-- 左上 -->
      <path d="M80,120 L100,100 M80,140 L120,100 M80,160 L140,100"/>
      <!-- 右上 -->
      <path d="M432,120 L412,100 M432,140 L392,100 M432,160 L372,100"/>
      <!-- 左下 -->
      <path d="M80,380 L100,400 M80,360 L120,400 M80,340 L140,400"/>
      <!-- 右下 -->
      <path d="M432,380 L412,400 M432,360 L392,400 M432,340 L372,400"/>
    </g>

    <!-- 小圆点装饰 -->
    <circle cx="256" cy="60" r="6" fill="#1890FF"/>
    <circle cx="256" cy="460" r="6" fill="#1890FF"/>
    <circle cx="60" cy="260" r="6" fill="#1890FF"/>
    <circle cx="452" cy="260" r="6" fill="#1890FF"/>
  </g>
</svg>