<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白色背景圆形 -->
  <circle cx="256" cy="256" r="250" fill="#FFFFFF" stroke="#22C55E" stroke-width="10"/>

  <!-- 草叶图案 -->
  <g transform="translate(256, 260) scale(0.9)">
    <!-- 主叶片 -->
    <path d="M0,-120 Q-60,-80 -80,0 Q-60,80 0,120 Q60,80 80,0 Q60,-80 0,-120 Z" fill="#22C55E"/>

    <!-- 左侧叶片 -->
    <path d="M-40,-60 Q-100,-40 -100,20 Q-80,80 -40,100 Q-20,80 -20,20 Q-20,-40 -40,-60 Z" fill="#16A34A"/>

    <!-- 右侧叶片 -->
    <path d="M40,-60 Q100,-40 100,20 Q80,80 40,100 Q20,80 20,20 Q20,-40 40,-60 Z" fill="#16A34A"/>

    <!-- 茎 -->
    <path d="M0,120 L0,150" stroke="#16A34A" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 科技芯片装饰 -->
  <g transform="translate(256, 260)" stroke="#1890FF" stroke-width="2" fill="none" opacity="0.5">
    <!-- 芯片外框 -->
    <rect x="-100" y="-140" width="200" height="280" rx="10" ry="10"/>
    <!-- 芯片线路 -->
    <line x1="-100" y1="-60" x2="-140" y2="-60"/>
    <line x1="100" y1="-60" x2="140" y2="-60"/>
    <line x1="-100" y1="60" x2="-140" y2="60"/>
    <line x1="100" y1="60" x2="140" y2="60"/>
    <!-- 小圆点 -->
    <circle cx="-140" cy="-60" r="4" fill="#1890FF"/>
    <circle cx="140" cy="-60" r="4" fill="#1890FF"/>
    <circle cx="-140" cy="60" r="4" fill="#1890FF"/>
    <circle cx="140" cy="60" r="4" fill="#1890FF"/>
  </g>
</svg>